name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Regenerate the HTML so a stale commit can never publish stale pages.
      - name: Build the docs site
        run: node docs/site/build.mjs

      # The build is deterministic; a diff means someone edited Markdown without
      # rebuilding, and the committed HTML no longer matches its source.
      - name: Check the committed HTML is up to date
        run: |
          if ! git diff --quiet -- docs/site; then
            echo "::error::docs/site is out of date. Run 'node docs/site/build.mjs' and commit the result."
            git diff --stat -- docs/site
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
