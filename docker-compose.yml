version: "3.8"
services:
  a-workbench:
    build: .
    ports:
      - "3000:3000"
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - DATABASE_URL=/data/tokens.db
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET}
      # The server now serves the portal itself, so portal + connect magic-link
      # URLs point back at the public server origin. Override for a real host.
      - SERVER_PUBLIC_URL=${SERVER_PUBLIC_URL:-http://localhost:3000}
      - PORTAL_URL=${PORTAL_URL:-http://localhost:3000}
    volumes:
      - ./data:/data

  sample-oauth:
    build:
      context: .
      dockerfile: Dockerfile.sample-oauth
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development

# Fix: add SESSION_SECRET for production startup
